name: SQL nested comments

on:
  push:
    paths: ['*.sql', '.github/**']
  pull_request:
    paths: ['*.sql', '.github/**']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/check_sql_nested_comments.py
